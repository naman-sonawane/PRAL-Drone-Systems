[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pral"
version = "0.1.0"
description = "PRAL drone footage acquisition pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "ortools",
    "networkx",
    "jsonschema",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["pral*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

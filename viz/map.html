<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRAL · E7 Mission Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--cyan:#22d3ee;--lime:#a3e635;--amber:#fbbf24;--pink:#f472b6;--dim:#5f6f8f;--red:#fb7185;--green:#34d399}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070e;color:#cdd9f0;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #map{position:absolute;inset:0;background:#05070e}
  .leaflet-container{background:#05070e}
  /* dark, cinematic overlays */
  #top{position:absolute;top:0;left:0;right:0;z-index:1000;height:56px;
    background:linear-gradient(180deg,#070b16ee,#070b1600);display:flex;align-items:center;
    gap:16px;padding:0 18px;pointer-events:none}
  #top .logo{font-weight:700;letter-spacing:3px;color:#fff;font-size:15px}
  #top .logo b{color:var(--cyan)}
  #top .sub{color:var(--dim);font-size:11px;letter-spacing:1px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;color:var(--red)}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #replay{pointer-events:auto;background:#10203a;border:1px solid var(--cyan);color:var(--cyan);
    padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px}
  #replay:hover{background:var(--cyan);color:#05070e}

  #panel{position:absolute;top:70px;left:14px;z-index:1000;width:262px;
    background:#0b1020e6;border:1px solid #1c2740;border-radius:11px;padding:14px;backdrop-filter:blur(4px)}
  #panel h2{margin:0 0 2px;font-size:14px;color:#fff;letter-spacing:.5px}
  #panel .osm{font-size:10px;color:var(--dim);margin-bottom:11px}
  .stat{display:flex;justify-content:space-between;font-size:11.5px;margin:5px 0}
  .stat .k{color:var(--dim)} .stat .v{color:var(--lime)}
  .barwrap{height:5px;background:#16243e;border-radius:3px;margin:9px 0 13px;overflow:hidden}
  #cov{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .2s}
  .leg{display:flex;flex-direction:column;gap:5px;margin-top:11px;border-top:1px dashed #1c2740;padding-top:10px}
  .leg div{font-size:10.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .leg i{width:18px;height:0;border-top-width:3px;border-top-style:solid;display:inline-block}

  #shotbox{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;align-items:center;gap:14px;background:#0b1426dd;border:1px solid #1c2740;
    border-radius:24px;padding:9px 20px}
  #shotbox .now{color:var(--amber);font-size:13px;letter-spacing:3px;text-transform:uppercase;min-width:84px;text-align:center}
  #shotbox .clk{color:var(--cyan);font-size:13px}
  #shotbox .wp{color:var(--dim);font-size:11px}

  /* drone marker */
  .drone{width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
    background:radial-gradient(circle,#ffffff,#22d3ee 60%,transparent 72%);
    box-shadow:0 0 16px #22d3ee,0 0 30px #22d3ee99}
  .drone:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
  .pin{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .leaflet-bar a{background:#0b1020;color:#9fb4d6;border-color:#1c2740}
  .leaflet-bar a:hover{background:#16233e}
  .leaflet-control-attribution{background:#0b1020aa!important;color:#5f6f8f!important}
  .leaflet-control-attribution a{color:#7d93b8!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div class="logo"><b>PRAL</b> · DRONE SYSTEMS</div>
  <div class="sub" id="bldg">AUTONOMOUS MISSION · loading…</div>
  <div class="spacer"></div>
  <div class="live"><span class="dot"></span>LIVE</div>
  <button id="replay">▶ REPLAY FLIGHT</button>
</div>

<div id="panel">
  <h2 id="pname">—</h2>
  <div class="osm" id="posm"></div>
  <div class="stat"><span class="k">orbit radius</span><span class="v" id="sR">—</span></div>
  <div class="stat"><span class="k">trajectory</span><span class="v" id="sWP">—</span></div>
  <div class="stat"><span class="k">shot types</span><span class="v" id="sSH">—</span></div>
  <div class="stat"><span class="k">close-ups</span><span class="v" id="sCU">—</span></div>
  <div class="stat"><span class="k">min clearance</span><span class="v" id="sCL">—</span></div>
  <div class="stat"><span class="k">surface coverage</span><span class="v" id="sCOVt">0%</span></div>
  <div class="barwrap"><div id="cov"></div></div>
  <div class="leg">
    <div><i style="border-color:#22d3ee"></i> footprint (OSM)</div>
    <div><i style="border-color:#38bdf8;border-top-style:dashed"></i> 360° survey orbit</div>
    <div><i style="border-color:#fbbf24"></i> planned trajectory</div>
    <div><i style="border-color:#f472b6"></i> occlusion close-ups</div>
  </div>
</div>

<div id="shotbox">
  <span class="clk" id="clk">00:00</span>
  <span class="now" id="shotNow">STANDBY</span>
  <span class="wp" id="wp">waypoint 0 / 0</span>
</div>

<script src="./geo_trace.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const G = window.PRAL_GEO;
if(!G){ document.body.innerHTML='<p style="padding:40px;color:#fff">geo_trace.js missing — run <code>python -m pral.geo_export</code></p>'; throw new Error('no geo'); }

// ---- map ----
const map = L.map('map',{zoomControl:true,attributionControl:true}).setView(G.home, 18);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OpenStreetMap © CARTO · footprint OSM way '+G.osm_id, maxZoom:21, subdomains:'abcd'
}).addTo(map);

// ---- static layers ----
const footprint = L.polygon(G.footprint,{color:'#22d3ee',weight:2,fillColor:'#22d3ee',fillOpacity:0.14}).addTo(map);
L.polyline([...G.orbit, G.orbit[0]],{color:'#38bdf8',weight:1.4,dashArray:'5 7',opacity:0.7}).addTo(map);

// close-up spurs (revealed during flight)
const spurs = G.closeups.map(cu=>{
  const ln=L.polyline([cu.from,cu.to],{color:'#f472b6',weight:1.3,opacity:0}).addTo(map);
  const pin=L.marker(cu.to,{icon:L.divIcon({className:'',html:'<div class="pin"></div>'})}).addTo(map);
  pin.setOpacity(0); return {ln,pin};
});

// trajectory (animated)
const TRAJ = G.trajectory;
const traj = L.polyline([],{color:'#fbbf24',weight:3,opacity:0.95}).addTo(map);
const drone = L.marker(TRAJ[0],{icon:L.divIcon({className:'',html:'<div class="drone"></div>'}),zIndexOffset:1000}).addTo(map);

map.fitBounds(L.polyline(G.orbit).getBounds().pad(0.25));

// ---- panel ----
document.getElementById('bldg').textContent='AUTONOMOUS MISSION · '+G.name;
document.getElementById('pname').textContent=G.name;
document.getElementById('posm').textContent='OSM way '+G.osm_id+' · '+G.height_m+' m · Univ. of Waterloo';
document.getElementById('sR').textContent=G.orbit_radius_m+' m';
document.getElementById('sWP').textContent=G.meta.n_waypoints+' waypoints';
document.getElementById('sSH').textContent=G.meta.n_shots+' distinct';
document.getElementById('sCU').textContent=G.meta.n_closeups;
document.getElementById('sCL').textContent=G.meta.min_clearance+' m'+(G.meta.collided?' ⚠':' ✓');

// ---- animation ----
const covEl=document.getElementById('cov'), covT=document.getElementById('sCOVt'),
  shotNow=document.getElementById('shotNow'), wpEl=document.getElementById('wp'), clk=document.getElementById('clk');
const FLIGHT=26; // seconds
let t0=null, raf=null;
function interp(arr,f){ const i=Math.min(arr.length-2,Math.floor(f)); const fr=f-i;
  return [arr[i][0]+(arr[i+1][0]-arr[i][0])*fr, arr[i][1]+(arr[i+1][1]-arr[i][1])*fr]; }

function frame(ts){
  if(t0===null)t0=ts; const el=(ts-t0)/1000; const p=Math.min(1,el/FLIGHT);
  const f=p*(TRAJ.length-1); const idx=Math.floor(f);

  traj.setLatLngs(TRAJ.slice(0,idx+1).concat([interp(TRAJ,f)]));
  drone.setLatLng(interp(TRAJ,f));

  // reveal close-up spurs as we pass their nearest waypoint
  spurs.forEach((s,k)=>{ const trigger=(k+0.5)/spurs.length; if(p>=trigger){ s.ln.setStyle({opacity:0.8}); s.pin.setOpacity(1); } });

  covEl.style.width=(G.meta.coverage*100*p)+'%';
  covT.textContent=(G.meta.coverage*100*p).toFixed(1)+'%';
  shotNow.textContent='◉ '+(G.shots[Math.min(G.shots.length-1,idx)]||'');
  wpEl.textContent='waypoint '+(idx+1)+' / '+TRAJ.length;
  const s=Math.floor(el); clk.textContent='00:'+String(s).padStart(2,'0');

  if(p<1) raf=requestAnimationFrame(frame);
  else { shotNow.textContent='✓ COMPLETE'; document.getElementById('bldg').textContent='MISSION COMPLETE · '+G.meta.n_waypoints+' shots captured'; }
}
function play(){ if(raf)cancelAnimationFrame(raf); t0=null;
  traj.setLatLngs([]); drone.setLatLng(TRAJ[0]);
  spurs.forEach(s=>{s.ln.setStyle({opacity:0}); s.pin.setOpacity(0);});
  raf=requestAnimationFrame(frame); }
document.getElementById('replay').onclick=play;
setTimeout(play, 600);
</script>
</body>
</html>

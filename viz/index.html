<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRAL · Autonomous Footage Acquisition</title>
<style>
  :root{
    --bg:#05070e; --panel:#0b1020cc; --panel2:#0d1426;
    --line:#1c2740; --txt:#cdd9f0; --dim:#5f6f8f; --cyan:#22d3ee; --lime:#a3e635;
    --amber:#fbbf24; --pink:#f472b6; --red:#fb7185; --green:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #app{display:grid;grid-template-columns:312px 1fr 340px;grid-template-rows:54px 1fr 30px;
    height:100vh;gap:1px;background:var(--line)}
  header{grid-column:1/4;background:linear-gradient(90deg,#070b16,#0a1020);
    display:flex;align-items:center;gap:16px;padding:0 18px}
  header .logo{font-weight:700;letter-spacing:3px;color:#fff;font-size:15px}
  header .logo b{color:var(--cyan)}
  header .sub{color:var(--dim);font-size:11px;letter-spacing:1px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;color:var(--red)}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--red);
    box-shadow:0 0 10px var(--red);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock{font-size:13px;color:var(--cyan);letter-spacing:1px;min-width:54px;text-align:right}
  button#replay{background:#10203a;border:1px solid var(--cyan);color:var(--cyan);
    padding:7px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;
    letter-spacing:1px;transition:.15s}
  button#replay:hover{background:var(--cyan);color:#05070e}

  /* left rail */
  #rail{background:var(--panel2);overflow-y:auto;padding:12px}
  .stage{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:10px;
    background:#0a1124;transition:.3s;position:relative;opacity:.5}
  .stage.active{opacity:1;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px #22d3ee33}
  .stage.done{opacity:1;border-color:#1d3a52}
  .stage .top{display:flex;align-items:center;gap:9px}
  .stage .num{width:22px;height:22px;border-radius:6px;background:#11203a;color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
  .stage.active .num{background:var(--cyan);color:#05070e}
  .stage.done .num{background:var(--green);color:#05070e}
  .stage .nm{font-size:12.5px;color:#e7eefb;font-weight:600}
  .stage .st{margin-left:auto;font-size:10px;letter-spacing:1px;color:var(--dim)}
  .stage.active .st{color:var(--cyan)}
  .stage.done .st{color:var(--green)}
  .stage .io{margin-top:9px;font-size:10.5px;display:none;border-top:1px dashed var(--line);padding-top:8px}
  .stage.active .io,.stage.done .io{display:block}
  .io .row{display:flex;justify-content:space-between;margin:3px 0;gap:8px}
  .io .k{color:var(--dim)} .io .v{color:var(--lime);text-align:right}
  .io .lbl{color:var(--cyan);font-size:9px;letter-spacing:1px;margin:4px 0 2px}

  /* center stage */
  #stage3d{position:relative;background:radial-gradient(ellipse at 50% 30%,#0a1326,#04060d 70%)}
  #c{display:block;width:100%;height:100%}
  .hud{position:absolute;pointer-events:none;font-size:11px;letter-spacing:.5px}
  #hudTL{top:14px;left:16px}
  #hudTL .big{font-size:34px;color:#fff;font-weight:700;line-height:1;letter-spacing:1px}
  #hudTL .cap{color:var(--dim);font-size:10px;letter-spacing:2px;margin-top:3px}
  #hudTR{top:14px;right:16px;text-align:right;display:flex;flex-direction:column;gap:9px}
  .gauge{min-width:130px}
  .gauge .cap{color:var(--dim);font-size:9px;letter-spacing:2px}
  .gauge .val{font-size:15px;color:var(--cyan)}
  .gauge .bar{height:4px;background:#16243e;border-radius:3px;margin-top:3px;overflow:hidden}
  .gauge .fill{height:100%;width:0;background:var(--cyan);transition:width .3s}
  #shotTag{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);
    background:#0b1426cc;border:1px solid var(--amber);color:var(--amber);padding:6px 16px;
    border-radius:20px;font-size:12px;letter-spacing:3px;opacity:0;transition:.3s;text-transform:uppercase}
  #legend{position:absolute;bottom:14px;left:16px;display:flex;gap:14px;font-size:10px;color:var(--dim)}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

  /* right rail */
  #side{background:var(--panel2);display:flex;flex-direction:column;overflow:hidden}
  .sec-h{font-size:10px;letter-spacing:2px;color:var(--dim);padding:11px 14px 6px}
  #console{flex:1;overflow-y:auto;padding:0 14px 12px;font-size:11px;line-height:1.7}
  #console .ln{opacity:0;animation:fade .35s forwards}
  #console .ln .t{color:#33415c;margin-right:7px}
  #console .ln .s{color:var(--cyan)}
  #console .ln.ev{color:var(--lime)}
  @keyframes fade{to{opacity:1}}
  #foot{border-top:1px solid var(--line);padding:11px 14px;max-height:46%;overflow-y:auto}
  #foot .ttl{font-size:10px;letter-spacing:2px;color:var(--amber);margin-bottom:7px;display:flex;justify-content:space-between}
  .clip{display:flex;align-items:center;gap:8px;font-size:10.5px;margin:3px 0;opacity:0;animation:fade .3s forwards}
  .clip .ix{color:#33415c;width:20px}
  .clip .sh{color:#e7eefb;width:74px;text-transform:uppercase;font-size:9.5px;letter-spacing:.5px}
  .clip .tg{color:var(--dim);font-size:9.5px}
  .clip.cu .sh{color:var(--pink)}

  footer{grid-column:1/4;background:#070b16;display:flex;align-items:center;padding:0 14px;gap:0}
  #tl{flex:1;height:5px;background:#101a2e;border-radius:3px;position:relative;overflow:hidden}
  #tlfill{position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:3px}
  footer .ph{font-size:10px;color:var(--dim);letter-spacing:1px;margin-left:14px;min-width:150px}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:#1c2740;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><b>PRAL</b> · DRONE SYSTEMS</div>
    <div class="sub">AUTONOMOUS FOOTAGE ACQUISITION · PIPELINE 1</div>
    <div class="spacer"></div>
    <div class="live"><span class="dot"></span>LIVE</div>
    <div class="clock" id="clock">00:00</div>
    <button id="replay">▶ REPLAY</button>
  </header>

  <div id="rail"></div>

  <div id="stage3d">
    <canvas id="c"></canvas>
    <div class="hud" id="hudTL">
      <div class="big" id="covPct">0.0%</div>
      <div class="cap">SURFACE COVERAGE</div>
    </div>
    <div class="hud" id="hudTR">
      <div class="gauge"><div class="cap">BATTERY</div><div class="val" id="batVal">100%</div>
        <div class="bar"><div class="fill" id="batFill" style="width:100%;background:var(--green)"></div></div></div>
      <div class="gauge"><div class="cap">MIN CLEARANCE</div><div class="val" id="clrVal">— m</div>
        <div class="bar"><div class="fill" id="clrFill" style="background:var(--lime)"></div></div></div>
      <div class="gauge"><div class="cap">VIEWPOINTS</div><div class="val" id="vpVal">0</div></div>
    </div>
    <div id="shotTag"></div>
    <div id="legend">
      <span><i style="background:#64748b"></i>structure</span>
      <span><i style="background:#16a34a"></i>obstacle</span>
      <span><i style="background:#22d3ee"></i>orbit</span>
      <span><i style="background:#fbbf24"></i>interest</span>
      <span><i style="background:#f472b6"></i>close-up</span>
    </div>
  </div>

  <div id="side">
    <div class="sec-h">▸ TELEMETRY STREAM</div>
    <div id="console"></div>
    <div id="foot">
      <div class="ttl"><span>CURATED FOOTAGE SET</span><span id="clipCount"></span></div>
      <div id="clips"></div>
    </div>
  </div>

  <footer>
    <div id="tl"><div id="tlfill"></div></div>
    <div class="ph" id="phase">STANDBY</div>
  </footer>
</div>

<script src="./trace.js"></script>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const T = window.PRAL_TRACE;
if(!T){ document.body.innerHTML='<p style="padding:40px;color:#fff">trace.js missing — run <code>python -m pral.viz_export</code></p>'; throw new Error('no trace'); }

// ENU (x=east,y=north,z=up) -> three (x, up, -north)
const v3 = p => new THREE.Vector3(p[0], (p[2]??0), -p[1]);
const C  = v3(T.centroid);
const Zmid = T.building_height*0.5;
const target = new THREE.Vector3(C.x, Zmid, C.z);

// ---- renderer / scene ----
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070e, 0.0042);
const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 4000);
cam.position.set(C.x+150, 95, C.z+150);
const ctrl = new OrbitControls(cam, canvas);
ctrl.target.copy(target); ctrl.enableDamping=true; ctrl.autoRotate=true; ctrl.autoRotateSpeed=0.45;
ctrl.minDistance=60; ctrl.maxDistance=520;

scene.add(new THREE.AmbientLight(0x8aa0c0, 0.55));
const key = new THREE.DirectionalLight(0xbcd4ff, 1.1); key.position.set(120,200,80); scene.add(key);
const rim = new THREE.PointLight(0x22d3ee, 0.8, 600); rim.position.set(C.x,140,C.z); scene.add(rim);

function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(document.getElementById('stage3d'));

// ---- ground grid ----
const grid = new THREE.GridHelper(700,70,0x16233e,0x0d1626);
grid.position.set(C.x,0,C.z); scene.add(grid);

// ---- AOI polygon ----
const aoiPts = T.aoi_polygon.map(p=>new THREE.Vector3(p[0],0.3,-p[1]));
const aoi = new THREE.Line(new THREE.BufferGeometry().setFromPoints(aoiPts),
  new THREE.LineBasicMaterial({color:0x2a9df0,transparent:true,opacity:0}));
scene.add(aoi);

// ---- building (instanced) ----
function instanced(points, size, color, op=1){
  const g = new THREE.BoxGeometry(size,size,size);
  const m = new THREE.MeshStandardMaterial({color,roughness:.7,metalness:.15,
    transparent:true,opacity:op,emissive:color,emissiveIntensity:.06});
  const mesh = new THREE.InstancedMesh(g,m,points.length);
  const d = new THREE.Object3D();
  points.forEach((p,i)=>{ const w=v3(p); d.position.copy(w); d.updateMatrix(); mesh.setMatrixAt(i,d.matrix); });
  mesh.instanceMatrix.needsUpdate=true; return mesh;
}
const vs = T.voxel_size;
const bGroup = new THREE.Group(); bGroup.position.y=0; bGroup.scale.y=0.001;
const building = instanced(T.building, vs*0.92, 0x6b7c95); bGroup.add(building); scene.add(bGroup);

const oGroup = new THREE.Group(); oGroup.scale.y=0.001;
const obstacles = instanced(T.obstacles, vs*0.95, 0x1f9d4d); oGroup.add(obstacles); scene.add(oGroup);

// ---- orbit ring ----
const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(T.orbit_ring.map(v3)),
  new THREE.LineBasicMaterial({color:0x22d3ee,transparent:true,opacity:0}));
scene.add(ring);

// ---- viewpoint / value-field markers (instanced spheres) ----
const VP = T.viewpoints;
const vpGeo = new THREE.SphereGeometry(0.9,10,10);
const vpMat = new THREE.MeshBasicMaterial({transparent:true,opacity:0.95});
const vpMesh = new THREE.InstancedMesh(vpGeo, vpMat, VP.length);
vpMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(VP.length*3),3);
const ramp = t=>{ const c=new THREE.Color(); c.setHSL((1-t)*0.62,0.95,0.55); return c; };
{ const d=new THREE.Object3D();
  VP.forEach((vp,i)=>{ d.position.copy(v3(vp.p)); d.scale.setScalar(0.001); d.updateMatrix();
    vpMesh.setMatrixAt(i,d.matrix); vpMesh.setColorAt(i,new THREE.Color(0x33506e)); }); }
vpMesh.instanceMatrix.needsUpdate=true; scene.add(vpMesh);

// ---- close-up rays ----
const cuGroup = new THREE.Group(); scene.add(cuGroup);
T.closeups.forEach(cu=>{
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([v3(cu.p),v3(cu.t)]),
    new THREE.LineBasicMaterial({color:0xf472b6,transparent:true,opacity:0}));
  const dot = new THREE.Mesh(new THREE.SphereGeometry(1.1,10,10),
    new THREE.MeshBasicMaterial({color:0xf472b6,transparent:true,opacity:0}));
  dot.position.copy(v3(cu.p)); ln.userData.dot=dot; cuGroup.add(ln); cuGroup.add(dot);
});

// ---- mission path + drone ----
const WP = T.mission.waypoints.map(v3);
const pathGeo = new THREE.BufferGeometry().setFromPoints(WP);
const path = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({color:0xfbbf24,transparent:true,opacity:.9}));
pathGeo.setDrawRange(0,0); scene.add(path);

const drone = new THREE.Group();
const body = new THREE.Mesh(new THREE.ConeGeometry(1.7,4,4),
  new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x22d3ee,emissiveIntensity:.7}));
body.rotation.x=Math.PI/2; drone.add(body);
const halo = new THREE.Mesh(new THREE.RingGeometry(2.6,3.3,24),
  new THREE.MeshBasicMaterial({color:0x22d3ee,side:THREE.DoubleSide,transparent:true,opacity:.5}));
halo.rotation.x=Math.PI/2; drone.add(halo);
const dlight = new THREE.PointLight(0x22d3ee,1.2,60); drone.add(dlight);
drone.visible=false; scene.add(drone);

// =========================================================================
//  TIMELINE  (seconds)
// =========================================================================
const WIN = { s1:[0,4], s2:[4,9], s3:[9,17.5], s4:[17.5,22.5], s5:[22.5,31] };
const TOTAL = 34;
const seg=(a,b,t)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
const ease=t=>t*t*(3-2*t);
const lerpV=(a,b,t)=>a.clone().lerp(b,t);

// build stage cards
const rail=document.getElementById('rail');
const cards=T.stages.map(s=>{
  const el=document.createElement('div'); el.className='stage';
  el.innerHTML=`<div class="top"><div class="num">${s.n}</div><div class="nm">${s.name}</div>
    <div class="st">QUEUED</div></div><div class="io"></div>`;
  rail.appendChild(el); return el;
});
function fillIO(i){
  const s=T.stages[i]; const io=cards[i].querySelector('.io');
  const rows=o=>Object.entries(o).map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  io.innerHTML=`<div class="lbl">INPUT</div>${rows(s.input)}<div class="lbl">OUTPUT</div>${rows(s.output)}`;
}

// schedule console + clip events
const cons=document.getElementById('console');
const events=[];
T.stages.forEach((s,si)=>{
  const [a,b]=Object.values(WIN)[si];
  events.push({t:a,fn:()=>{ setActive(si); addLog(`── STAGE ${s.n}: ${s.name.toUpperCase()} ──`,true); }});
  s.log.forEach((line,li)=>{ events.push({t:a+(b-a)*(0.12+0.72*li/Math.max(1,s.log.length-1)),
    fn:()=>addLog(line)}); });
  events.push({t:b-0.05,fn:()=>setDone(si)});
});
// clips stream during stage 5
const clipsEl=document.getElementById('clips');
T.clips.forEach((c,i)=>{ events.push({t:WIN.s5[0]+ (WIN.s5[1]-WIN.s5[0])*0.25 + i*0.18, fn:()=>addClip(c,i)}); });
events.push({t:31.2,fn:()=>{ document.getElementById('clipCount').textContent=`${T.clips.length} CLIPS`;
  addLog('curated footage set validated ✓ — schema OK, consumable',true); }});
events.sort((x,y)=>x.t-y.t);

function setActive(i){ cards.forEach((c,j)=>{ c.classList.toggle('active',j===i);
  if(j<i)c.classList.add('done'); }); fillIO(i);
  cards[i].querySelector('.st').textContent='RUNNING';
  document.getElementById('phase').textContent=`STAGE ${i+1} · ${T.stages[i].name.toUpperCase()}`; }
function setDone(i){ cards[i].classList.add('done'); cards[i].classList.remove('active');
  cards[i].querySelector('.st').textContent='DONE'; fillIO(i); }
function addLog(text,ev=false){ const d=new Date(clock*1000);
  const ts=`${String(Math.floor(clock/60)).padStart(2,'0')}:${String(Math.floor(clock%60)).padStart(2,'0')}`;
  const ln=document.createElement('div'); ln.className='ln'+(ev?' ev':'');
  ln.innerHTML=`<span class="t">${ts}</span>${ev?'':'<span class="s">▸ </span>'}${text}`;
  cons.appendChild(ln); cons.scrollTop=cons.scrollHeight; }
function addClip(c,i){ const cu=c.tags.some(t=>String(t).includes('occlusion'));
  const el=document.createElement('div'); el.className='clip'+(cu?' cu':'');
  el.innerHTML=`<span class="ix">${String(i).padStart(2,'0')}</span><span class="sh">${c.shot}</span>
    <span class="tg">${cu?'↳ occlusion close-up':c.tags.slice(1,2).join('')}</span>`;
  clipsEl.appendChild(el); }

// HUD refs
const covPct=document.getElementById('covPct'), vpVal=document.getElementById('vpVal'),
  batVal=document.getElementById('batVal'), batFill=document.getElementById('batFill'),
  clrVal=document.getElementById('clrVal'), clrFill=document.getElementById('clrFill'),
  shotTag=document.getElementById('shotTag'), clockEl=document.getElementById('clock'),
  tlfill=document.getElementById('tlfill');

// =========================================================================
let clock=0, last=performance.now(), fired=0, started=performance.now();
function reset(){
  clock=0; fired=0; started=performance.now();
  cons.innerHTML=''; clipsEl.innerHTML=''; document.getElementById('clipCount').textContent='';
  cards.forEach(c=>{c.className='stage'; c.querySelector('.st').textContent='QUEUED'; c.querySelector('.io').innerHTML='';});
  aoi.material.opacity=0; ring.material.opacity=0; bGroup.scale.y=0.001; oGroup.scale.y=0.001;
  pathGeo.setDrawRange(0,0); drone.visible=false; shotTag.style.opacity=0;
  cuGroup.children.forEach(o=>{o.material.opacity=0;});
  const d=new THREE.Object3D();
  VP.forEach((vp,i)=>{ d.position.copy(v3(vp.p)); d.scale.setScalar(0.001); d.updateMatrix();
    vpMesh.setMatrixAt(i,d.matrix); vpMesh.setColorAt(i,new THREE.Color(0x33506e)); });
  vpMesh.instanceMatrix.needsUpdate=true; vpMesh.instanceColor.needsUpdate=true;
}
document.getElementById('replay').onclick=reset;

const dummy=new THREE.Object3D();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(clock<TOTAL) clock+=dt;
  ctrl.update();

  // fire scheduled events
  while(fired<events.length && events[fired].t<=clock){ events[fired].fn(); fired++; }

  // reveals
  aoi.material.opacity   = ease(seg(0.6,3,clock));
  bGroup.scale.y         = Math.max(0.001, ease(seg(2,5,clock)));
  oGroup.scale.y         = Math.max(0.001, ease(seg(4.2,7,clock)));
  ring.material.opacity  = 0.85*ease(seg(6,9,clock));

  // stage 3: viewpoints drop in + drone orbit + coverage
  const s3=seg(WIN.s3[0],WIN.s3[1],clock);
  const nShown=Math.floor(s3*VP.length);
  for(let i=0;i<VP.length;i++){ const sc=i<nShown?1: (i===nShown? ease((s3*VP.length)%1):0.001);
    dummy.position.copy(v3(VP[i].p)); dummy.scale.setScalar(Math.max(0.001,sc)); dummy.updateMatrix();
    vpMesh.setMatrixAt(i,dummy.matrix); }
  vpMesh.instanceMatrix.needsUpdate=true;
  vpVal.textContent=nShown;
  covPct.textContent=(T.coverage*100*ease(s3)).toFixed(1)+'%';

  // close-up rays reveal (second half of stage 3)
  const cuP=seg(13,17.3,clock);
  cuGroup.children.forEach((o,k)=>{ o.material.opacity=Math.min(0.9, cuP*1.4); });

  // stage 4: recolor viewpoints by value (heatmap) + amber interest glow
  const s4=seg(WIN.s4[0],WIN.s4[1],clock);
  if(s4>0){ for(let i=0;i<VP.length;i++){ const base=new THREE.Color(0x33506e);
    vpMesh.setColorAt(i, base.lerp(ramp(VP[i].v), ease(s4))); }
    vpMesh.instanceColor.needsUpdate=true; }

  // drone flight: orbit (stage3) then mission path (stage5)
  if(clock>=WIN.s3[0] && clock<WIN.s4[0]){
    drone.visible=true;
    const a=seg(WIN.s3[0],WIN.s3[1],clock)*Math.PI*2*1.25;
    drone.position.set(C.x+T.orbit_radius*Math.cos(a), Zmid+8, C.z-T.orbit_radius*Math.sin(a)*-1);
    drone.position.z = C.z + T.orbit_radius*Math.sin(a);
    drone.lookAt(target);
  }
  const s5=seg(WIN.s5[0],WIN.s5[1],clock);
  if(s5>0 && WP.length>1){
    drone.visible=true;
    pathGeo.setDrawRange(0, Math.max(2,Math.floor(s5*WP.length)));
    const f=s5*(WP.length-1); const i0=Math.min(WP.length-2,Math.floor(f)); const fr=f-i0;
    drone.position.copy(lerpV(WP[i0],WP[i0+1],fr)); drone.lookAt(target);
    // shot tag
    const shot=T.mission.shots[Math.min(T.mission.shots.length-1,Math.round(f))];
    shotTag.textContent='◉ '+shot; shotTag.style.opacity=0.95;
    // battery + clearance
    const bu=T.battery_used*s5; batVal.textContent=Math.round((1-bu)*100)+'%';
    batFill.style.width=((1-bu)*100)+'%';
    batFill.style.background = (1-bu)>0.4?'var(--green)':'var(--amber)';
    clrVal.textContent=T.min_clearance.toFixed(2)+' m';
    clrFill.style.width=Math.min(100,T.min_clearance/4*100)+'%';
  } else if(clock<WIN.s5[0]){ shotTag.style.opacity=0; }
  if(clock>=WIN.s5[1]){ document.getElementById('phase').textContent='MISSION COMPLETE · FOOTAGE CAPTURED';
    drone.visible=true; }

  halo.rotation.z+=dt*3;
  clockEl.textContent=`${String(Math.floor(clock/60)).padStart(2,'0')}:${String(Math.floor(clock%60)).padStart(2,'0')}`;
  tlfill.style.width=(clock/TOTAL*100)+'%';

  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
resize(); reset(); requestAnimationFrame(tick);
</script>
</body>
</html>
